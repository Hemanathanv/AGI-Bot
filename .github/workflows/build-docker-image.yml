name: Publish Adithya-Bot Image to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-to-ghcr:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Rebranded Image
        run: docker pull sprdocker26/agi-bot:v1.1.0

      - name: Tag and Push to GHCR
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker tag sprdocker26/agi-bot:v1.1.0 "ghcr.io/${OWNER}/agi-bot:v1.1.0"
          docker tag sprdocker26/agi-bot:v1.1.0 "ghcr.io/${OWNER}/agi-bot:latest"
          docker push "ghcr.io/${OWNER}/agi-bot:v1.1.0"
          docker push "ghcr.io/${OWNER}/agi-bot:latest"
