name: Build and Push Adithya-Bot Docker Image

on:
  workflow_dispatch:
    inputs:
      registry:
        description: "Container registry host (e.g. ghcr.io or docker.io)"
        required: true
        default: "ghcr.io"
      image_name:
        description: "Full image name without tag (e.g. ghcr.io/hemanathanv/adithya-bot)"
        required: true
        default: "ghcr.io/hemanathanv/adithya-bot"
      image_tag:
        description: "Image tag"
        required: true
        default: "v1.1.0"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ github.event.inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ github.event.inputs.image_name }}:${{ github.event.inputs.image_tag }}
            ${{ github.event.inputs.image_name }}:latest
          platforms: linux/amd64
